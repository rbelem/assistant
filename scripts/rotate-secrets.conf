***REMOVED*** rotate-secrets.conf — credential rotation configuration
***REMOVED***
***REMOVED*** Items are Bitwarden login items in the `assistant` vault.
***REMOVED*** Categories:
***REMOVED***   auto   — stateless, safe for `rotate --all` to rotate when past age
***REMOVED***   manual — stateful, refused by `--all` unless --i-know-what-im-doing
***REMOVED***
***REMOVED*** Generators:
***REMOVED***   hex      — openssl rand -hex <length> (length = bytes, output = 2*length chars)
***REMOVED***   base64   — openssl rand -base64 <length> (length = bytes, no padding)
***REMOVED***   password — Diceware from /usr/share/dict/words (<word_count> words)

items:
  ***REMOVED*** Auto-rotate: stateless credentials
  - name: assistant/zitadel-admin-password
    generator: password
    word_count: 6
    max_age_days: 90
    category: auto

  ***REMOVED*** NOTE: assistant/caddy-admin-password excluded — no live consumer found.
  ***REMOVED*** caddy.nix wires no admin auth; ansible fetches it but never uses the value.
  ***REMOVED*** Re-enable if a consumer is added.
  ***REMOVED*** - name: assistant/caddy-admin-password
  ***REMOVED***   generator: password
  ***REMOVED***   word_count: 6
  ***REMOVED***   max_age_days: 90
  ***REMOVED***   category: auto

  ***REMOVED*** Manual-only: stateful secrets that need coordinated migration
  - name: assistant/restic-backup-password
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: restic cannot change repo password. Rotation = data loss. Manual procedure required."

  - name: assistant/n8n-encryption-key
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: n8n uses this to encrypt stored credentials. Rotation breaks all integrations. Manual procedure required."

  - name: assistant/postgres-password
    generator: password
    word_count: 6
    max_age_days: 90
    category: manual
    runbook: "DO NOT auto-rotate: shared by n8n+Zitadel+Postgres server. Needs ALTER USER + k8s secret update + coordinated restart. Manual migration required."

  - name: assistant/zitadel-masterkey
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: encrypts Zitadel datastore. Needs Zitadel key-change procedure. Manual migration required."

backup:
  ***REMOVED*** Secure Note in Bitwarden that stores rotation history as JSON array.
  ***REMOVED*** Schema: [{item, old_value_b64, rotated_at, by}]
  history_item: assistant/secrets-rotation-history
  keep_per_item: 5

logging:
  log_file: ~/.local/share/rotate-secrets/rotate.log
  log_level: info

deploy_handoff:
  ansible_cmd: "cd ansible && ansible-playbook -i inventory/hosts.yml playbooks/secrets-render.yml && ansible-playbook -i inventory/hosts.yml playbooks/secrets-apply.yml"
  health_checks:
    - item: assistant/zitadel-admin-password
      cmd: "kubectl -n auth exec deploy/zitadel -- zitadel admin-login --from-env"
