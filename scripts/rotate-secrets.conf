# rotate-secrets.conf — credential rotation configuration
#
# Items are Bitwarden login items in the `assistant` vault.
# Categories:
#   auto   — stateless, safe for `rotate --all` to rotate when past age
#   manual — stateful, refused by `--all` unless --i-know-what-im-doing
#
# Generators:
#   hex      — openssl rand -hex <length> (length = bytes, output = 2*length chars)
#   base64   — openssl rand -base64 <length> (length = bytes, no padding)
#   password — Diceware from /usr/share/dict/words (<word_count> words)

items:
  # Auto-rotate: stateless credentials
  - name: assistant/zitadel-admin-password
    generator: password
    word_count: 6
    max_age_days: 90
    category: auto

  # NOTE: assistant/caddy-admin-password excluded — no live consumer found.
  # caddy.nix wires no admin auth; ansible fetches it but never uses the value.
  # Re-enable if a consumer is added.
  # - name: assistant/caddy-admin-password
  #   generator: password
  #   word_count: 6
  #   max_age_days: 90
  #   category: auto

  # Manual-only: stateful secrets that need coordinated migration
  - name: assistant/restic-backup-password
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: restic cannot change repo password. Rotation = data loss. Manual procedure required."

  - name: assistant/n8n-encryption-key
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: n8n uses this to encrypt stored credentials. Rotation breaks all integrations. Manual procedure required."

  - name: assistant/postgres-password
    generator: password
    word_count: 6
    max_age_days: 90
    category: manual
    runbook: "DO NOT auto-rotate: shared by n8n+Zitadel+Postgres server. Needs ALTER USER + k8s secret update + coordinated restart. Manual migration required."

  - name: assistant/zitadel-masterkey
    generator: hex
    length: 32
    max_age_days: 365
    category: manual
    runbook: "DO NOT auto-rotate: encrypts Zitadel datastore. Needs Zitadel key-change procedure. Manual migration required."

backup:
  # Secure Note in Bitwarden that stores rotation history as JSON array.
  # Schema: [{item, old_value_b64, rotated_at, by}]
  history_item: assistant/secrets-rotation-history
  keep_per_item: 5

logging:
  log_file: ~/.local/share/rotate-secrets/rotate.log
  log_level: info

deploy_handoff:
  ansible_cmd: "./scripts/deploy.sh --skip-tofu --skip-infect --skip-nixos --only-ansible"
  health_checks:
    - item: assistant/zitadel-admin-password
      cmd: "kubectl -n auth exec deploy/zitadel -- zitadel admin-login --from-env"
