# Headroom Local Proxy Config
# Wraps opencode on the local machine
#
# This config is used by `headroom wrap opencode`.
# The proxy only listens on localhost — not reachable from the network.

proxy:
  port: 8787
  host: 127.0.0.1      # local only — no external access

  upstreams:
    - name: minimax
      base_url: https://api.minimax.io/v1
      default: true

compression:
  code: true            # AST-aware code compression
  json: true            # JSON smart crushing
  text: true            # prose compression
  image: false          # skip on local — adds latency for minimal gain on code tasks
  level: 5              # balanced — good compression without being too aggressive

memory:
  enabled: true
  store_type: sqlite
  path: ~/.headroom/memory
  learn_enabled: true   # learn from your sessions over time

output_shaping:
  enabled: true
  verbosity: concise    # terse / concise / normal / verbose
  effort_routing: true  # reduce thinking effort on routine turns

ccr:
  enabled: true
  ttl: 43200            # cache TTL in seconds (12 hours — shorter than VPS since local disk is smaller)
  cache_path: ~/.headroom/ccr
