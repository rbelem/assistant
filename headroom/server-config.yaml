# Headroom VPS Proxy Config
# Deployed alongside Zet Agent on k3s
#
# This proxy sits between Zet and the upstream LLM API (minimax.io).
# All traffic is compressed before hitting the LLM, saving 60-95% of tokens.

proxy:
  # Listen on all interfaces so k3s services can reach it
  port: 8787
  host: 0.0.0.0

  # Upstream LLM endpoints to compress traffic for.
  # The proxy forwards compressed requests to these endpoints.
  upstreams:
    - name: minimax
      base_url: https://api.minimax.io/v1
      default: true

compression:
  # Individual compressor toggles.
  # Disable any compressor that causes issues for your workload.
  code: true           # AST-aware code compression — preserves structure, strips redundancy
  json: true           # JSON smart crushing — collapses verbose payloads
  text: true           # Kompress-base prose compression — summarizes long text
  image: true          # Image compression — 40-90% reduction on vision inputs

  # Aggressiveness level (1-10).
  # 1 = minimal compression, nearly lossless.
  # 10 = maximum compression, may lose some nuance.
  # 7 is a good default for production — aggressive but safe.
  level: 7

memory:
  # Cross-agent shared memory.
  # Allows multiple agents (e.g., Zet + a secondary agent) to share context.
  enabled: true
  store_type: sqlite   # lightweight; no external deps needed
  path: /data/headroom/memory

  # Auto-learn from agent failures and successes.
  # Headroom analyzes past sessions to improve future compression.
  learn_enabled: true
  learn_path: /data/headroom/learnings

output_shaping:
  # Reduce LLM output verbosity on routine turns.
  # Saves output tokens — the LLM produces shorter, more focused responses.
  enabled: true
  verbosity: concise   # terse / concise / normal / verbose
  effort_routing: true # reduce thinking/reasoning effort on low-complexity turns

ccr:
  # Reversible compression.
  # Caches original (uncompressed) content so it can be retrieved later if needed.
  # Useful for debugging or when the LLM needs the full context back.
  enabled: true
  ttl: 86400           # cache TTL in seconds (24 hours)
  cache_path: /data/headroom/ccr

logging:
  level: info          # debug / info / warn / error
  format: json         # json for structured logging, text for human-readable
