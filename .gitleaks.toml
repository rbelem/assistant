[extend]
useDefault = true

[[rules]]
id = "rclb-dev-leak"
description = "OVH-era domain leakage"
regex = '''\brclb\.dev\b'''
keywords = ["REDACTED-DOMAIN"]
tags = ["domain", "ovh-era"]

[[rules]]
id = "ovh-plan-code"
description = "OVH plan code (vps-le-N-N-N)"
regex = '''\bvps-le-\d+-\d+-\d+\b'''
keywords = ["vps-le"]
tags = ["plan-code", "ovh-era"]

[[rules]]
id = "ovh-s3-endpoint"
description = "OVH Object Storage endpoint"
regex = '''s3\.[a-z]+\.io\.cloud\.ovh\.net'''
keywords = ["s3", "ovh"]
tags = ["endpoint", "ovh-era"]

[[rules]]
id = "ovh-region"
description = "OVH region code (REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1, REDACTED-REGION, REDACTED-REGION1)"
regex = '''\b(REDACTED-REGION|REDACTED-REGION|REDACTED-REGION|REDACTED-REGION|REDACTED-REGION|REDACTED-REGION|REDACTED-REGION)([0-9]|-1)?\b'''
keywords = ["REDACTED-REGION", "REDACTED-REGION", "REDACTED-REGION", "REDACTED-REGION", "REDACTED-REGION", "REDACTED-REGION", "REDACTED-REGION"]
tags = ["region", "ovh-era"]

[[rules]]
id = "manaus-tz-leak"
description = "City-level timezone leak"
regex = '''REDACTED-TZ'''
keywords = ["Manaus"]
tags = ["geolocation"]

[[rules]]
id = "ovh-domain-leak"
description = "OVH infrastructure domain"
regex = '''\b[a-z0-9-]+\.ovh\.(net|com)\b'''
keywords = ["ovh.net", "ovh.com"]
tags = ["ovh-era"]

[[allowlists]]
description = "ignore the rules file itself and the scrub map"
paths = [
  '''\.gitleaks\.toml$''',
  '''replacements\.txt$'''
]

[[allowlists]]
description = "allowlist the S3-compatible false positive"
regexes = ["^S3-compatible$"]
