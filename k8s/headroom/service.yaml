apiVersion: v1
kind: Service
metadata:
  name: headroom-service
  namespace: headroom
  labels:
    app: headroom
spec:
  ***REMOVED*** NodePort so host-level Caddy can proxy without k8s DNS resolution
  type: NodePort
  selector:
    app: headroom
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: 30878
      protocol: TCP
