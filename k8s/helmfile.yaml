repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: zitadel
    url: https://charts.zitadel.com

helmDefaults:
  timeout: 900  # seconds; zitadel-init setup job needs > 5m on first run

releases:
  - name: postgres
    namespace: n8n
    chart: bitnami/postgresql
    version: 16.7.27
    values:
      - helm/postgres-values.yaml

  - name: n8n
    namespace: n8n
    chart: oci://8gears.container-registry.com/library/n8n
    version: 2.0.1
    values:
      - helm/n8n-values.yaml
    needs:
      - n8n/postgres

  - name: zitadel
    namespace: auth
    chart: zitadel/zitadel
    version: 10.0.4
    values:
      - helm/zitadel-values.yaml
    needs:
      - n8n/postgres
