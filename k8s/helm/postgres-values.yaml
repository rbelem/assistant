global:
  postgresql:
    auth:
      existingSecret: postgres-secrets
      secretKeys:
        adminPasswordKey: postgres-password
      database: postgres    ***REMOVED*** default DB; n8n + zitadel DBs created via initdbScripts below
persistence:
  size: 5Gi
  storageClass: local-path
primary:
  service:
    type: ClusterIP
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
initdbScripts:
  create-dbs.sql: |
    CREATE DATABASE n8n;
    CREATE DATABASE zitadel;
