replicaCount: 1

zitadel:
  configmapConfig:
    ExternalDomain: auth.zet.rclb.dev
    ExternalSecure: true
    TLS:
      Enabled: false  # Caddy handles TLS

  masterkeySecretName: zitadel-secrets
  masterkeySecretKey: masterkey

# DB credentials via DSN from rendered secret (configmapConfig holds plain strings only)
env:
  - name: ZITADEL_DATABASE_POSTGRES_DSN
    valueFrom:
      secretKeyRef:
        name: zitadel-secrets
        key: db_dsn

service:
  # ClusterIP — Caddy proxies via manifest-managed NodePort service (k8s/manifests/auth/zitadel-nodeport.yaml)
  type: ClusterIP
  port: 8080

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 500m
