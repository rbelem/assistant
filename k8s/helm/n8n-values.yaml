replicaCount: 1
strategy:
  type: Recreate
fullnameOverride: n8n

service:
  type: NodePort
  ports:
    http: 80
  nodePort: 30002

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path

env:
  - name: N8N_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: n8n-secrets
        key: encryption_key
  - name: N8N_CONFIG_FILES
    value: /home/node/.n8n/config.json
  - name: DB_TYPE
    value: postgresdb
  - name: DB_POSTGRESDB_HOST
    value: postgres-postgresql.n8n
  - name: DB_POSTGRESDB_PORT
    value: "5432"
  - name: DB_POSTGRESDB_DATABASE
    value: n8n
  - name: DB_POSTGRESDB_USER
    value: postgres
  - name: DB_POSTGRESDB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-secrets
        key: postgres-password
  - name: N8N_HOST
    value: n8n.REDACTED-DOMAIN
  - name: N8N_PROTOCOL
    value: https
  - name: WEBHOOK_URL
    value: https://n8n.REDACTED-DOMAIN/
  - name: N8N_EDITOR_BASE_URL
    value: https://n8n.REDACTED-DOMAIN/
  - name: GENERIC_TIMEZONE
    value: REDACTED-TZ
  - name: N8N_SECURE_COOKIE
    value: "true"

# OIDC via Zitadel — configured after Zitadel is running
extraEnv:
  - name: N8N_SSO_OIDC_ENABLED
    value: "true"
