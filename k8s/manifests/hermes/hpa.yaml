# Optional HorizontalPodAutoscaler for Hermes Agent
# NOTE: Hermes is stateful — scaling beyond 1 replica requires shared storage
# and careful handling of memory/skills directories. Keep min=max=1 for now.
# This manifest is prepared for future use if stateless mode is supported.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-agent-hpa
  namespace: hermes
  labels:
    app: hermes-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes-agent
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
