apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app: hermes-agent
data:
  ***REMOVED*** Mounted at /opt/data/config.yaml (HERMES_HOME). Secrets come from
  ***REMOVED*** hermes-secrets env vars; dashboard auth via HERMES_DASHBOARD_BASIC_AUTH_*.
  config.yaml: |
    model:
      provider: opencode-go
      default: deepseek-v4-flash
    fallback_providers:
      - provider: openrouter
        model: deepseek/deepseek-v4-flash
    terminal:
      backend: local
      timeout: 180
