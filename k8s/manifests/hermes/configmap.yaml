apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
  labels:
    app: hermes-agent
data:
  config.yaml: |
    agent:
      model: "deepseek/deepseek-v4-flash"
      temperature: 0.7
      max_tokens: 4096
      system_prompt: |
        You are Hermes, a personal AI agent running on a self-hosted
        infrastructure. You have persistent memory, scheduling, and
        access to various skills including OCR for extracting text
        from images and PDFs.

    platforms:
      discord:
        enabled: true
        ***REMOVED*** Token comes from HERMES_DISCORD_TOKEN env var (in secret)
      api:
        enabled: true
        host: "0.0.0.0"
        port: 8080

    skills:
      enabled:
        - web_search
        - file_operations
        - shell_commands
        - memory_recall
        - scheduling
        - ocr

    scheduler:
      enabled: true
      jobs: []

    memory:
      backend: local
      max_memories: 10000
