apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zet-data-pvc
  namespace: zet
  labels:
    app: zet-agent
spec:
  accessModes:
    - ReadWriteOnce
  # k3s default storage class — provisions local-path volumes
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi