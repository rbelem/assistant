apiVersion: v1
kind: Service
metadata:
  name: zet-service
  namespace: zet
  labels:
    app: zet-agent
spec:
  # NodePort so host-level Caddy can proxy without k8s DNS resolution.
  # 30080 → OpenAI-compatible API server (hermes.zet.rclb.dev/v1/*)
  # 30090 → web dashboard (hermes.zet.rclb.dev/*)
  type: NodePort
  selector:
    app: zet-agent
  ports:
    - name: api
      port: 8642
      targetPort: api
      nodePort: 30080
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: dashboard
      nodePort: 30090
      protocol: TCP