apiVersion: apps/v1
kind: Deployment
metadata:
  name: zet-agent
  namespace: zet
  labels:
    app: zet-agent
    app.kubernetes.io/name: zet-agent
    app.kubernetes.io/part-of: zet-stack
spec:
  # Single replica — stateful agent, do not scale beyond 1
  replicas: 1
  strategy:
    type: Recreate # Avoid two pods fighting over the same PVC
  selector:
    matchLabels:
      app: zet-agent
  template:
    metadata:
      labels:
        app: zet-agent
        app.kubernetes.io/name: zet-agent
    spec:
      containers:
        - name: zet-agent
          # Upstream image nousresearch/hermes-agent:latest — self-hosted AI agent (Discord gateway)
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - "gateway"
            - "run"
          ports:
            - name: api
              containerPort: 8642
              protocol: TCP
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          envFrom:
            # Secrets created by Ansible from Bitwarden:
            # DISCORD_BOT_TOKEN, DISCORD_ALLOWED_USERS, OPENCODE_GO_API_KEY,
            # OPENROUTER_API_KEY, API_SERVER_KEY,
            # HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD_HASH/_SECRET
            - secretRef:
                name: zet-secrets
          env:
            - name: HERMES_HOME
              value: "/opt/data"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: TZ
              value: "REDACTED-TZ"
          volumeMounts:
            - name: zet-data
              mountPath: /opt/data
            - name: zet-config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: zet-data
          persistentVolumeClaim:
            claimName: zet-data-pvc
        - name: zet-config
          configMap:
            name: zet-config