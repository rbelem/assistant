# Optional HorizontalPodAutoscaler for Zet Agent
# NOTE: Zet is stateful — scaling beyond 1 replica requires shared storage
# This manifest is disabled for now — do not apply (stateful single-replica, shared PVC).
# This manifest is prepared for future use if stateless mode is supported.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zet-agent-hpa
  namespace: zet
  labels:
    app: zet-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zet-agent
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80