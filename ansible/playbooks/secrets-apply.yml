---
# secrets-apply.yml — apply rendered secrets/configs to the VPS.
#
# Runs on the VPS (hosts: zet). Does NOT require PASSWORD env or bitw
# CLI on the VPS — all vault decryption happened on the workstation during
# secrets-render.yml. This playbook only copies the pinned allowlist of
# rendered files and applies the k8s manifests.
#
# Allowlist (pinned — no glob over-copy):
#   .rendered/k8s-secrets/zet-*-secret.yaml    → kubectl apply
#   .rendered/k8s-secrets/zet-*-configmap.yaml → kubectl apply
#   .rendered/host-files/etc-zet-config.json   → /etc/zet/config.json
#   .rendered/host-files/etc-tailscale-authkey → /etc/tailscale/authkey
#   .rendered/host-files/etc-caddy-env         → /etc/caddy/env
#
# NOT applied to VPS (workstation-only):
#   .rendered/vault.env           — TF_VAR_* + render inputs
#   .rendered/terraform.tfvars    — tofu inputs
#   .rendered/runtime-config.json — covered by etc-zet-config.json
#   .rendered/host-files/etc-ssh-keys-rbelem — standalone SSH key artifact;
#     note /etc/zet/config.json DOES embed ssh_private_key (pre-existing
#     design, consumed by NixOS modules) — only the separate artifact is skipped.
- name: Apply rendered secrets and configs to VPS
  hosts: zet
  become: yes
  gather_facts: no

  vars:
    rendered_dir: "{{ playbook_dir }}/../../.rendered"
    k8s_secrets_dir: "{{ rendered_dir }}/k8s-secrets"
    host_files_dir: "{{ rendered_dir }}/host-files"
    remote_staging_dir: /tmp/zet-rendered

  tasks:
    # ── Preflight: verify rendered files exist on workstation ────
    - name: Check rendered k8s-secrets directory exists (on workstation)
      ansible.builtin.stat:
        path: "{{ k8s_secrets_dir }}"
      delegate_to: localhost
      become: no
      register: k8s_secrets_stat

    - name: Fail if rendered k8s-secrets directory is missing
      ansible.builtin.fail:
        msg: |
          Rendered k8s-secrets directory not found at {{ k8s_secrets_dir }}.
          Run secrets-render.yml first:
            ansible-playbook -i inventory/hosts.yml playbooks/secrets-render.yml
      when: not k8s_secrets_stat.stat.exists

    - name: Check rendered host-files directory exists (on workstation)
      ansible.builtin.stat:
        path: "{{ host_files_dir }}"
      delegate_to: localhost
      become: no
      register: host_files_stat

    - name: Fail if rendered host-files directory is missing
      ansible.builtin.fail:
        msg: |
          Rendered host-files directory not found at {{ host_files_dir }}.
          Run secrets-render.yml first:
            ansible-playbook -i inventory/hosts.yml playbooks/secrets-render.yml
      when: not host_files_stat.stat.exists

    # ── Stage rendered files on VPS ──────────────────────────────
    - name: Clean remote staging directory
      ansible.builtin.file:
        path: "{{ remote_staging_dir }}"
        state: absent

    - name: Create remote staging directories
      ansible.builtin.file:
        path: "{{ remote_staging_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - k8s-secrets
        - host-files

    - name: Copy rendered k8s Secret/ConfigMap manifests to VPS (pinned allowlist)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ remote_staging_dir }}/k8s-secrets/"
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ k8s_secrets_dir }}/zet-zet-secrets-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-n8n-secrets-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-postgres-secrets-n8n-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-postgres-secrets-auth-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-zitadel-secrets-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-headroom-secrets-secret.yaml"
        - "{{ k8s_secrets_dir }}/zet-tofu-inputs-configmap.yaml"

    - name: Copy rendered host files to VPS (pinned allowlist)
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ remote_staging_dir }}/host-files/{{ item.dest }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - src: "{{ host_files_dir }}/etc-zet-config.json"
          dest: etc-zet-config.json
        - src: "{{ host_files_dir }}/etc-tailscale-authkey"
          dest: etc-tailscale-authkey
        - src: "{{ host_files_dir }}/etc-caddy-env"
          dest: etc-caddy-env

    # ── Apply k8s manifests ──────────────────────────────────────
    - name: Ensure k8s namespaces exist
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ namespace_list }}"

    - name: Apply rendered k8s Secret and ConfigMap manifests (pinned allowlist)
      kubernetes.core.k8s:
        state: present
        src: "{{ item }}"
      loop:
        - "{{ remote_staging_dir }}/k8s-secrets/zet-zet-secrets-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-n8n-secrets-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-postgres-secrets-n8n-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-postgres-secrets-auth-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-zitadel-secrets-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-headroom-secrets-secret.yaml"
        - "{{ remote_staging_dir }}/k8s-secrets/zet-tofu-inputs-configmap.yaml"

    # ── Apply host-level files ───────────────────────────────────
    - name: Ensure /etc/zet directory exists
      ansible.builtin.file:
        path: /etc/zet
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install /etc/zet/config.json from rendered file
      ansible.builtin.copy:
        src: "{{ remote_staging_dir }}/host-files/etc-zet-config.json"
        dest: /etc/zet/config.json
        remote_src: yes
        owner: root
        group: root
        mode: "0600"

    - name: Ensure /etc/tailscale directory exists
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install /etc/tailscale/authkey from rendered file
      ansible.builtin.copy:
        src: "{{ remote_staging_dir }}/host-files/etc-tailscale-authkey"
        dest: /etc/tailscale/authkey
        remote_src: yes
        owner: root
        group: root
        mode: "0600"

    - name: Ensure /etc/caddy directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        owner: root
        group: root
        mode: "0755"  # caddy service runs as User=caddy; needs traverse to read config/env

    - name: Install /etc/caddy/env from rendered file
      ansible.builtin.copy:
        src: "{{ remote_staging_dir }}/host-files/etc-caddy-env"
        dest: /etc/caddy/env
        remote_src: yes
        owner: root
        group: root
        mode: "0600"

    # ── Cleanup ──────────────────────────────────────────────────
    - name: Remove remote staging directory
      ansible.builtin.file:
        path: "{{ remote_staging_dir }}"
        state: absent

    # ── Summary ──────────────────────────────────────────────────
    - name: Print apply summary
      ansible.builtin.debug:
        msg: |
          Applied rendered secrets to VPS:
          k8s manifests applied:
            - zet-secrets (namespace: zet)
            - n8n-secrets (namespace: n8n)
            - postgres-secrets (namespace: n8n)
            - postgres-secrets (namespace: auth)
            - zitadel-secrets (namespace: auth)
            - headroom-secrets (namespace: zet)
            - tofu-inputs ConfigMap (namespace: zet)
          Host files installed:
            - /etc/zet/config.json
            - /etc/tailscale/authkey
            - /etc/caddy/env
