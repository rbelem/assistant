---
- name: Sync secrets from Bitwarden vault to k8s
  hosts: rodrigo-agent
  become: yes
  gather_facts: no

  vars:
    bw_vault_name: "rodrigo-agent"
    bw_session_file: /root/.bw_session_token

  tasks:
    - name: Check if bw CLI is available
      ansible.builtin.command: which bw
      register: bw_which
      changed_when: false

    - name: Fail if bw CLI not found
      ansible.builtin.fail:
        msg: "Bitwarden CLI not found. Run bootstrap playbook first."
      when: bw_which.rc != 0

    - name: Check for existing session token
      ansible.builtin.stat:
        path: "{{ bw_session_file }}"
      register: bw_token_stat

    - name: Read existing session token
      ansible.builtin.slurp:
        src: "{{ bw_session_file }}"
      register: bw_token_content
      when: bw_token_stat.stat.exists

    - name: Set BW_SESSION fact
      ansible.builtin.set_fact:
        bw_session: "{{ bw_token_content.content | b64decode | trim }}"
      when: bw_token_stat.stat.exists

    - name: Validate Bitwarden session
      ansible.builtin.command: >
        bw status --session {{ bw_session }}
      register: bw_status
      changed_when: false
      failed_when: false
      when: bw_token_stat.stat.exists

    - name: Check if session is unlocked
      ansible.builtin.set_fact:
        bw_unlocked: "{{ bw_token_stat.stat.exists and bw_status.rc == 0 and '\"status\":\"unlocked\"' in bw_status.stdout }}"
      when: bw_token_stat.stat.exists

    - name: Fail if Bitwarden is not logged in / unlocked
      ansible.builtin.fail:
        msg: |
          Bitwarden vault is not unlocked. Please:
            1. bw login (if not logged in)
            2. bw unlock --raw > {{ bw_session_file }}
          Then re-run this playbook.
      when: not bw_unlocked | default(false)

    - name: Sync Bitwarden vault
      ansible.builtin.command: bw sync --session {{ bw_session }}
      changed_when: false

    ***REMOVED*** ── Fetch secrets from Bitwarden ──────────────────────────────
    - name: Fetch OpenRouter API key
      ansible.builtin.command: >
        bw get password "OpenRouter API Key"
        --session {{ bw_session }}
      register: openrouter_key
      changed_when: false

    - name: Assert OpenRouter key is non-empty
      ansible.builtin.assert:
        that:
          - openrouter_key.stdout | length > 0
        fail_msg: "Bitwarden item 'OpenRouter API Key' returned empty or not found"

    - name: Fetch Hermes Discord bot token
      ansible.builtin.command: >
        bw get password "Hermes Discord Token"
        --session {{ bw_session }}
      register: hermes_discord
      changed_when: false

    - name: Assert Hermes Discord token is non-empty
      ansible.builtin.assert:
        that:
          - hermes_discord.stdout | length > 0
        fail_msg: "Bitwarden item 'Hermes Discord Token' returned empty or not found"

    - name: Fetch n8n encryption key
      ansible.builtin.command: >
        bw get password "n8n Encryption Key"
        --session {{ bw_session }}
      register: n8n_encryption_key
      changed_when: false

    - name: Assert n8n encryption key is non-empty
      ansible.builtin.assert:
        that:
          - n8n_encryption_key.stdout | length > 0
        fail_msg: "Bitwarden item 'n8n Encryption Key' returned empty or not found"

    - name: Fetch Zitadel masterkey
      ansible.builtin.command: >
        bw get password "Zitadel Masterkey"
        --session {{ bw_session }}
      register: zitadel_masterkey
      changed_when: false

    - name: Assert Zitadel masterkey is non-empty
      ansible.builtin.assert:
        that:
          - zitadel_masterkey.stdout | length > 0
        fail_msg: "Bitwarden item 'Zitadel Masterkey' returned empty or not found"

    - name: Fetch Zitadel admin password
      ansible.builtin.command: >
        bw get password "Zitadel Admin Password"
        --session {{ bw_session }}
      register: zitadel_admin_password
      changed_when: false

    - name: Assert Zitadel admin password is non-empty
      ansible.builtin.assert:
        that:
          - zitadel_admin_password.stdout | length > 0
        fail_msg: "Bitwarden item 'Zitadel Admin Password' returned empty or not found"

    - name: Fetch Porkbun API credentials
      ansible.builtin.command: >
        bw get item "Porkbun API Key"
        --session {{ bw_session }}
      register: porkbun_raw
      changed_when: false

    - name: Assert Porkbun credentials are non-empty
      ansible.builtin.assert:
        that:
          - porkbun_raw.stdout | length > 0
        fail_msg: "Bitwarden item 'Porkbun API Key' returned empty or not found"

    - name: Parse Porkbun credentials
      ansible.builtin.set_fact:
        porkbun_creds: "{{ porkbun_raw.stdout | from_json }}"

    - name: Fetch Lambda Cloud API key
      ansible.builtin.command: >
        bw get password "Lambda Cloud API Key"
        --session {{ bw_session }}
      register: lambda_key
      changed_when: false

    - name: Assert Lambda Cloud API key is non-empty
      ansible.builtin.assert:
        that:
          - lambda_key.stdout | length > 0
        fail_msg: "Bitwarden item 'Lambda Cloud API Key' returned empty or not found"

    - name: Fetch Tailscale auth key
      ansible.builtin.command: >
        bw get password "Tailscale Auth Key"
        --session {{ bw_session }}
      register: tailscale_key
      changed_when: false

    - name: Assert Tailscale auth key is non-empty
      ansible.builtin.assert:
        that:
          - tailscale_key.stdout | length > 0
        fail_msg: "Bitwarden item 'Tailscale Auth Key' returned empty or not found"

    - name: Fetch Caddy admin password
      ansible.builtin.command: >
        bw get password "Caddy Admin Password"
        --session {{ bw_session }}
      register: caddy_password
      changed_when: false

    - name: Assert Caddy admin password is non-empty
      ansible.builtin.assert:
        that:
          - caddy_password.stdout | length > 0
        fail_msg: "Bitwarden item 'Caddy Admin Password' returned empty or not found"

    - name: Fetch restic backup password
      ansible.builtin.command: >
        bw get password "Restic Backup Password"
        --session {{ bw_session }}
      register: restic_password
      changed_when: false

    - name: Assert restic backup password is non-empty
      ansible.builtin.assert:
        that:
          - restic_password.stdout | length > 0
        fail_msg: "Bitwarden item 'Restic Backup Password' returned empty or not found"

    - name: Fetch OVH Object Storage credentials
      ansible.builtin.command: >
        bw get item "OVH Object Storage"
        --session {{ bw_session }}
      register: ovh_creds_raw
      changed_when: false

    - name: Assert OVH Object Storage credentials are non-empty
      ansible.builtin.assert:
        that:
          - ovh_creds_raw.stdout | length > 0
        fail_msg: "Bitwarden item 'OVH Object Storage' returned empty or not found"

    - name: Parse OVH credentials
      ansible.builtin.set_fact:
        ovh_creds: "{{ ovh_creds_raw.stdout | from_json }}"

    - name: Fetch Postgres password
      ansible.builtin.command: >
        bw get password "Postgres Password"
        --session {{ bw_session }}
      register: postgres_password
      changed_when: false

    - name: Assert Postgres password is non-empty
      ansible.builtin.assert:
        that:
          - postgres_password.stdout | length > 0
        fail_msg: "Bitwarden item 'Postgres Password' returned empty or not found"

    ***REMOVED*** ── Create k8s namespaces ─────────────────────────────────────
    - name: Create k8s namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ namespace_list }}"

    ***REMOVED*** ── Create k8s secrets ────────────────────────────────────────
    - name: Create hermes-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hermes-secrets
            namespace: hermes
          type: Opaque
          data:
            OPENROUTER_API_KEY: "{{ openrouter_key.stdout | b64encode }}"
            DISCORD_BOT_TOKEN: "{{ hermes_discord.stdout | b64encode }}"

    - name: Create n8n-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: n8n-secrets
            namespace: n8n
          type: Opaque
          data:
            encryption_key: "{{ n8n_encryption_key.stdout | b64encode }}"
            DB_POSTGRESDB_PASSWORD: "{{ postgres_password.stdout | b64encode }}"

    - name: Create postgres-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: "{{ item }}"
          type: Opaque
          data:
            postgres-password: "{{ postgres_password.stdout | b64encode }}"
      loop:
        - n8n
        - auth

    - name: Create zitadel-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: zitadel-secrets
            namespace: auth
          type: Opaque
          data:
            masterkey: "{{ zitadel_masterkey.stdout | b64encode }}"
            ZITADEL_ADMIN_PASSWORD: "{{ zitadel_admin_password.stdout | b64encode }}"

    ***REMOVED*** ── Write host-level secret files ─────────────────────────────
    - name: Ensure /etc/restic directory exists
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write restic environment file
      ansible.builtin.copy:
        dest: /etc/restic/env
        owner: root
        group: root
        mode: "0600"
        content: |
          RESTIC_PASSWORD={{ restic_password.stdout }}
          AWS_ACCESS_KEY_ID={{ (ovh_creds.fields | selectattr('name', 'equalto', 'access_key') | first).value }}
          AWS_SECRET_ACCESS_KEY={{ (ovh_creds.fields | selectattr('name', 'equalto', 'secret_key') | first).value }}

    - name: Ensure /etc/tailscale directory exists
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write Tailscale auth key file
      ansible.builtin.copy:
        dest: /etc/tailscale/authkey
        owner: root
        group: root
        mode: "0600"
        content: "{{ tailscale_key.stdout }}"

    - name: Ensure /etc/caddy directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write Caddy environment file
      ansible.builtin.copy:
        dest: /etc/caddy/env
        owner: root
        group: root
        mode: "0600"
        content: |
          PORKBUN_API_KEY={{ (porkbun_creds.fields | selectattr('name', 'equalto', 'api_key') | first).value }}
          PORKBUN_SECRET_API_KEY={{ (porkbun_creds.fields | selectattr('name', 'equalto', 'secret_api_key') | first).value }}
          LAMBDA_CLOUD_API_KEY={{ lambda_key.stdout }}

    - name: Print sync summary
      ansible.builtin.debug:
        msg: |
          Secrets synced from Bitwarden vault "{{ bw_vault_name }}":
          - k8s namespaces: {{ namespace_list | join(', ') }}
          - k8s secrets: hermes-secrets, n8n-secrets, postgres-secrets (n8n+auth), zitadel-secrets
          - /etc/restic/env written
          - /etc/tailscale/authkey written
          - /etc/caddy/env written
