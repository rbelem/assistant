---
- name: Sync secrets from Bitwarden vault to k8s
  hosts: assistant
  become: yes
  gather_facts: no

  vars:
    bw_vault_name: "assistant"
    bw_session_file: /root/.bw_session_token

  tasks:
    - name: Check if bw CLI is available
      ansible.builtin.command: which bw
      register: bw_which
      changed_when: false

    - name: Fail if bw CLI not found
      ansible.builtin.fail:
        msg: "Bitwarden CLI not found. Run bootstrap playbook first."
      when: bw_which.rc != 0

    - name: Check for existing session token
      ansible.builtin.stat:
        path: "{{ bw_session_file }}"
      register: bw_token_stat

    - name: Read existing session token
      ansible.builtin.slurp:
        src: "{{ bw_session_file }}"
      register: bw_token_content
      when: bw_token_stat.stat.exists

    - name: Set BW_SESSION fact
      ansible.builtin.set_fact:
        bw_session: "{{ bw_token_content.content | b64decode | trim }}"
      when: bw_token_stat.stat.exists

    - name: Validate Bitwarden session
      ansible.builtin.command: >
        bw status --session {{ bw_session }}
      register: bw_status
      changed_when: false
      failed_when: false
      when: bw_token_stat.stat.exists

    - name: Check if session is unlocked
      ansible.builtin.set_fact:
        bw_unlocked: "{{ bw_token_stat.stat.exists and bw_status.rc == 0 and '\"status\":\"unlocked\"' in bw_status.stdout }}"
      when: bw_token_stat.stat.exists

    - name: Fail if Bitwarden is not logged in / unlocked
      ansible.builtin.fail:
        msg: |
          Bitwarden vault is not unlocked. Please:
            1. bw login (if not logged in)
            2. bw unlock --raw > {{ bw_session_file }}
          Then re-run this playbook.
      when: not bw_unlocked | default(false)

    - name: Ensure /etc/agent directory exists
      ansible.builtin.file:
        path: /etc/agent
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write systemd EnvironmentFile for BW session
      ansible.builtin.copy:
        dest: /etc/agent/bw_session.env
        owner: root
        group: root
        mode: "0600"
        content: "BW_SESSION={{ bw_session }}\n"
      when: bw_unlocked | default(false)
      no_log: true

    - name: Sync Bitwarden vault
      ansible.builtin.command: bw sync --session {{ bw_session }}
      changed_when: false

    ***REMOVED*** ── Fetch secrets from Bitwarden ──────────────────────────────
    ***REMOVED*** Dropped 2026-07-27: Lambda Cloud (OCR skill unused), OVH Object Storage
    ***REMOVED*** (restic backup deferred), restic-backup-password (orphaned).
    ***REMOVED*** OpenRouter → minimax.io (assistant/minimax-api-key).

    - name: Fetch minimax API key
      ansible.builtin.command: >
        bw get password "assistant/minimax-api-key"
        --session {{ bw_session }}
      register: minimax_key
      changed_when: false

    - name: Assert minimax key is non-empty
      ansible.builtin.assert:
        that:
          - minimax_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/minimax-api-key' returned empty or not found"

    - name: Fetch Hermes Discord bot token
      ansible.builtin.command: >
        bw get password "assistant/hermes-discord-token"
        --session {{ bw_session }}
      register: hermes_discord
      changed_when: false

    - name: Assert Hermes Discord token is non-empty
      ansible.builtin.assert:
        that:
          - hermes_discord.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/hermes-discord-token' returned empty or not found"

    - name: Fetch n8n encryption key
      ansible.builtin.command: >
        bw get password "assistant/n8n-encryption-key"
        --session {{ bw_session }}
      register: n8n_encryption_key
      changed_when: false

    - name: Assert n8n encryption key is non-empty
      ansible.builtin.assert:
        that:
          - n8n_encryption_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/n8n-encryption-key' returned empty or not found"

    - name: Fetch Zitadel masterkey
      ansible.builtin.command: >
        bw get password "assistant/zitadel-masterkey"
        --session {{ bw_session }}
      register: zitadel_masterkey
      changed_when: false

    - name: Assert Zitadel masterkey is non-empty
      ansible.builtin.assert:
        that:
          - zitadel_masterkey.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/zitadel-masterkey' returned empty or not found"

    - name: Fetch Zitadel admin password
      ansible.builtin.command: >
        bw get password "assistant/zitadel-admin-password"
        --session {{ bw_session }}
      register: zitadel_admin_password
      changed_when: false

    - name: Assert Zitadel admin password is non-empty
      ansible.builtin.assert:
        that:
          - zitadel_admin_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/zitadel-admin-password' returned empty or not found"

    - name: Fetch Porkbun API key
      ansible.builtin.command: >
        bw get password "assistant/porkbun-api-key"
        --session {{ bw_session }}
      register: porkbun_api_key
      changed_when: false
      no_log: true

    - name: Assert Porkbun API key is non-empty
      ansible.builtin.assert:
        that:
          - porkbun_api_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/porkbun-api-key' returned empty or not found"

    - name: Fetch Porkbun secret API key
      ansible.builtin.command: >
        bw get password "assistant/porkbun-secret-api-key"
        --session {{ bw_session }}
      register: porkbun_secret_api_key
      changed_when: false
      no_log: true

    - name: Assert Porkbun secret API key is non-empty
      ansible.builtin.assert:
        that:
          - porkbun_secret_api_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/porkbun-secret-api-key' returned empty or not found"

    ***REMOVED*** NOTE: assistant/tailscale-authkey must be type 1 (Login) with the key in the
    ***REMOVED*** password field. Earlier docs called for a Secure Note; the convention
    ***REMOVED*** requires Login to match `bw get password`.
    - name: Fetch Tailscale auth key
      ansible.builtin.command: >
        bw get password "assistant/tailscale-authkey"
        --session {{ bw_session }}
      register: tailscale_key
      changed_when: false

    - name: Assert Tailscale auth key is non-empty
      ansible.builtin.assert:
        that:
          - tailscale_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/tailscale-authkey' returned empty or not found"

    - name: Fetch Caddy admin password
      ansible.builtin.command: >
        bw get password "assistant/caddy-admin-password"
        --session {{ bw_session }}
      register: caddy_password
      changed_when: false

    - name: Assert Caddy admin password is non-empty
      ansible.builtin.assert:
        that:
          - caddy_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/caddy-admin-password' returned empty or not found"

    - name: Fetch Postgres password
      ansible.builtin.command: >
        bw get password "assistant/postgres-password"
        --session {{ bw_session }}
      register: postgres_password
      changed_when: false

    - name: Assert Postgres password is non-empty
      ansible.builtin.assert:
        that:
          - postgres_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/postgres-password' returned empty or not found"

    ***REMOVED*** ── Fetch vault-driven runtime config from Bitwarden ──────────
    ***REMOVED*** Bitwarden SSH key: "assistant/vps-ssh-key" — type 5, .sshKey.privateKey
    - name: Fetch VPS SSH private key from SSH key item
      ansible.builtin.shell: >
        bw get item "assistant/vps-ssh-key"
        --session {{ bw_session }}
        | jq -r '.sshKey.privateKey'
      register: vps_ssh_key_raw
      changed_when: false
      no_log: true

    - name: Assert VPS SSH key non-empty
      ansible.builtin.assert:
        that: vps_ssh_key_raw.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/vps-ssh-key' returned empty SSH key"

    ***REMOVED*** Bitwarden Secure Note: "assistant/domain-config"
    - name: Fetch Domain Config (Secure Note JSON)
      ansible.builtin.shell: >
        bw get notes "assistant/domain-config"
        --session {{ bw_session }}
      register: domain_json_raw
      changed_when: false

    - name: Assert Domain Config non-empty and valid JSON
      ansible.builtin.assert:
        that: domain_json_raw.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/domain-config' is empty"

    - name: Set domain fact from JSON
      ansible.builtin.set_fact:
        domain_name: "{{ (domain_json_raw.stdout | from_json).domain }}"

    - name: Set subdomains fact from JSON (list)
      ansible.builtin.set_fact:
        domain_subdomains: "{{ (domain_json_raw.stdout | from_json).subdomains }}"

    ***REMOVED*** Bitwarden Secure Note: "assistant/tofu-inputs" — JSON with vps_host, vps_ssh_user, vps_ssh_port
    - name: Fetch Tofu Inputs (Secure Note with VPS config)
      ansible.builtin.shell: >
        bw get notes "assistant/tofu-inputs"
        --session {{ bw_session }}
      register: tofu_inputs_raw
      changed_when: false
      no_log: true

    - name: Assert Tofu Inputs non-empty and valid JSON
      ansible.builtin.assert:
        that: tofu_inputs_raw.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/tofu-inputs' is empty"

    - name: Set VPS host from tofu-inputs JSON
      ansible.builtin.set_fact:
        vps_host: "{{ (tofu_inputs_raw.stdout | from_json).vps_host }}"

    - name: Set VPS SSH user from tofu-inputs JSON
      ansible.builtin.set_fact:
        vps_ssh_user: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_user }}"

    - name: Set VPS SSH port from tofu-inputs JSON
      ansible.builtin.set_fact:
        vps_ssh_port: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_port }}"

    ***REMOVED*** ── Write runtime config consumed by Nix modules ──────────────
    - name: Ensure /etc/agent directory exists
      ansible.builtin.file:
        path: /etc/agent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render /etc/agent/config.json from vault-derived facts
      ansible.builtin.copy:
        dest: /etc/agent/config.json
        owner: root
        group: root
        mode: "0600"
        content: |
          {
            "domain":     "{{ domain_name }}",
            "subdomains": {{ domain_subdomains | to_nice_json }},
            "vps_host":   "{{ vps_host }}",
            "ssh_user":   "{{ vps_ssh_user }}",
            "ssh_port":   {{ vps_ssh_port }},
            "ssh_private_key": "{{ vps_ssh_key_raw.stdout | trim }}",
            "tofu_inputs": {{ (tofu_inputs_raw.stdout | from_json) | to_nice_json }}
          }

    ***REMOVED*** ── Create k8s namespaces ─────────────────────────────────────
    - name: Create k8s namespaces
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ namespace_list }}"

    ***REMOVED*** ── Create k8s secrets ────────────────────────────────────────
    - name: Create hermes-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hermes-secrets
            namespace: hermes
          type: Opaque
          data:
            MINIMAX_API_KEY: "{{ minimax_key.stdout | b64encode }}"
            DISCORD_BOT_TOKEN: "{{ hermes_discord.stdout | b64encode }}"

    - name: Create n8n-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: n8n-secrets
            namespace: n8n
          type: Opaque
          data:
            encryption_key: "{{ n8n_encryption_key.stdout | b64encode }}"
            DB_POSTGRESDB_PASSWORD: "{{ postgres_password.stdout | b64encode }}"

    - name: Create postgres-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: "{{ item }}"
          type: Opaque
          data:
            postgres-password: "{{ postgres_password.stdout | b64encode }}"
      loop:
        - n8n
        - auth

    - name: Create zitadel-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: zitadel-secrets
            namespace: auth
          type: Opaque
          data:
            masterkey: "{{ zitadel_masterkey.stdout | b64encode }}"
            ZITADEL_ADMIN_PASSWORD: "{{ zitadel_admin_password.stdout | b64encode }}"

    - name: Create headroom-secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: headroom-secrets
            namespace: hermes
          type: Opaque
          data:
            MINIMAX_API_KEY: "{{ minimax_key.stdout | b64encode }}"

    ***REMOVED*** ── Write host-level secret files ─────────────────────────────
    - name: Ensure /etc/tailscale directory exists
      ansible.builtin.file:
        path: /etc/tailscale
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write Tailscale auth key file
      ansible.builtin.copy:
        dest: /etc/tailscale/authkey
        owner: root
        group: root
        mode: "0600"
        content: "{{ tailscale_key.stdout }}"

    - name: Ensure /etc/caddy directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write Caddy environment file
      ansible.builtin.copy:
        dest: /etc/caddy/env
        owner: root
        group: root
        mode: "0600"
        content: |
          PORKBUN_API_KEY={{ porkbun_api_key.stdout }}
          PORKBUN_SECRET_API_KEY={{ porkbun_secret_api_key.stdout }}

    - name: Ensure /opt/assistant/scripts directory exists
      ansible.builtin.file:
        path: /opt/assistant/scripts
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy snapshot-state.sh to VPS
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/snapshot-state.sh"
        dest: /opt/assistant/scripts/snapshot-state.sh
        owner: root
        group: root
        mode: "0750"

    - name: Deploy restore-state.sh to VPS
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/restore-state.sh"
        dest: /opt/assistant/scripts/restore-state.sh
        owner: root
        group: root
        mode: "0750"

    - name: Print sync summary
      ansible.builtin.debug:
        msg: |
          Secrets synced from Bitwarden vault "{{ bw_vault_name }}":
          - k8s namespaces: {{ namespace_list | join(', ') }}
          - k8s secrets: hermes-secrets, n8n-secrets, postgres-secrets (n8n+auth), zitadel-secrets, headroom-secrets
          - /etc/tailscale/authkey written
          - /etc/caddy/env written
          - /etc/agent/bw_session.env written (systemd EnvironmentFile)
          - /opt/assistant/scripts/snapshot-state.sh deployed
          - /opt/assistant/scripts/restore-state.sh deployed
