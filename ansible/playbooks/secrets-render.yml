---
# secrets-render.yml — render Bitwarden Secrets Manager items to local .rendered/ files.
#
# Runs on the WORKSTATION (localhost, connection: local). Secrets are fetched
# from Bitwarden Secrets Manager via wrapper scripts (scripts/bws-get). No master
# password needed — only a BWS access token.
#
# Outputs (all under .rendered/, gitignored):
#   k8s-secrets/assistant-*-secret.yaml     — k8s Secret manifests
#   k8s-secrets/assistant-*-configmap.yaml  — k8s ConfigMap manifests
#   host-files/etc-agent-config.json        — consumed by NixOS modules
#   host-files/etc-tailscale-authkey        — Tailscale auth key file
#   host-files/etc-caddy-env                — Caddy env file (Porkbun keys)
#   host-files/etc-ssh-keys-rbelem          — VPS SSH private key (reference)
#
# The companion playbook secrets-apply.yml copies the pinned allowlist from
# .rendered/ to the VPS and applies the k8s manifests.
#
# Prerequisites:
#   - bws CLI installed on workstation (official Bitwarden Secrets Manager CLI)
#   - Helper scripts at scripts/bws-get and scripts/bws-check
#   - BWS access token: export BWS_ACCESS_TOKEN or add sm_access_token to
#     ~/.config/bitw/config (bws reads env directly)
#   - No master password needed (SM uses access tokens, not vault unlock)
- name: Render Bitwarden Secrets Manager items to local .rendered/ files
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    rendered_dir: "{{ playbook_dir }}/../../.rendered"
    k8s_secrets_dir: "{{ rendered_dir }}/k8s-secrets"
    host_files_dir: "{{ rendered_dir }}/host-files"

  tasks:
    # ── Preflight ────────────────────────────────────────────────
    - name: Check bws CLI is available
      ansible.builtin.command: which bws
      register: bws_which
      changed_when: false

    - name: Fail if bws CLI not found
      ansible.builtin.fail:
        msg: "bws CLI not found on workstation. Install via nix: nix profile install nixpkgs#bws, or ensure it's in devbox global."
      when: bws_which.rc != 0

    - name: Verify Secrets Manager access token
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-check"
      register: bws_check_result
      changed_when: false
      failed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Fail if BWS access token is missing or invalid
      ansible.builtin.fail:
        msg: |
          BWS access token missing or invalid.
          Export BWS_ACCESS_TOKEN or add sm_access_token to ~/.config/bitw/config.
      when: bws_check_result.rc != 0

    - name: Ensure render output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ rendered_dir }}"
        - "{{ k8s_secrets_dir }}"
        - "{{ host_files_dir }}"

    # ── Fetch from Secrets Manager ───────────────────────────────
    - name: Fetch VPS SSH key (raw private key from SM)
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get VPS_SSH_KEY"
      register: vps_ssh_key_json
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert VPS SSH key looks like a private key
      ansible.builtin.assert:
        that:
          - vps_ssh_key_json.stdout | length > 0
          - vps_ssh_key_json.stdout is match('^-----BEGIN')
        fail_msg: "SM secret 'VPS_SSH_KEY' is empty or does not look like a private key"
      no_log: true

    - name: Fetch Domain Config (JSON from SM)
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DOMAIN_CONFIG"
      register: domain_json_raw
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Domain Config non-empty and valid JSON
      ansible.builtin.assert:
        that:
          - domain_json_raw.stdout | length > 0
          - (domain_json_raw.stdout | from_json) is mapping
        fail_msg: "SM secret 'DOMAIN_CONFIG' is empty or not valid JSON"
      no_log: true

    - name: Set domain facts
      ansible.builtin.set_fact:
        domain_name: "{{ (domain_json_raw.stdout | from_json).domain }}"
        domain_subdomains: "{{ (domain_json_raw.stdout | from_json).subdomains }}"

    - name: Fetch Tofu Inputs (JSON from SM)
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get TOFU_INPUTS"
      register: tofu_inputs_raw
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Tofu Inputs non-empty and valid JSON
      ansible.builtin.assert:
        that:
          - tofu_inputs_raw.stdout | length > 0
          - (tofu_inputs_raw.stdout | from_json) is mapping
        fail_msg: "SM secret 'TOFU_INPUTS' is empty or not valid JSON"
      no_log: true

    - name: Set tofu-inputs facts
      ansible.builtin.set_fact:
        vps_host: "{{ (tofu_inputs_raw.stdout | from_json).vps_host }}"
        vps_ssh_user: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_user }}"
        vps_ssh_port: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_port }}"
        tofu_inputs_obj: "{{ tofu_inputs_raw.stdout | from_json }}"

    - name: Fetch minimax API key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get MINIMAX_API_KEY"
      register: minimax_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert minimax key is non-empty
      ansible.builtin.assert:
        that: minimax_key.stdout | length > 0
        fail_msg: "SM secret 'MINIMAX_API_KEY' is empty or not found"
      no_log: true

    - name: Fetch Hermes Discord bot token
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DISCORD_BOT_TOKEN"
      register: hermes_discord
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Hermes Discord token is non-empty
      ansible.builtin.assert:
        that: hermes_discord.stdout | length > 0
        fail_msg: "SM secret 'DISCORD_BOT_TOKEN' is empty or not found"
      no_log: true

    - name: Fetch Discord allowed users
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DISCORD_ALLOWED_USERS"
      register: discord_allowed_users
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Discord allowed users is non-empty
      ansible.builtin.assert:
        that: discord_allowed_users.stdout | length > 0
        fail_msg: "SM secret 'DISCORD_ALLOWED_USERS' is empty or not found"
      no_log: true

    - name: Fetch n8n encryption key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get N8N_ENCRYPTION_KEY"
      register: n8n_encryption_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert n8n encryption key is non-empty
      ansible.builtin.assert:
        that: n8n_encryption_key.stdout | length > 0
        fail_msg: "SM secret 'N8N_ENCRYPTION_KEY' is empty or not found"
      no_log: true

    - name: Fetch Zitadel masterkey
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get ZITADEL_MASTERKEY"
      register: zitadel_masterkey
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Zitadel masterkey is non-empty
      ansible.builtin.assert:
        that: zitadel_masterkey.stdout | length > 0
        fail_msg: "SM secret 'ZITADEL_MASTERKEY' is empty or not found"
      no_log: true

    - name: Fetch Zitadel admin password
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get ZITADEL_ADMIN_PASSWORD"
      register: zitadel_admin_password
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Zitadel admin password is non-empty
      ansible.builtin.assert:
        that: zitadel_admin_password.stdout | length > 0
        fail_msg: "SM secret 'ZITADEL_ADMIN_PASSWORD' is empty or not found"
      no_log: true

    - name: Fetch Tailscale auth key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get TAILSCALE_AUTHKEY"
      register: tailscale_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Tailscale auth key is non-empty
      ansible.builtin.assert:
        that: tailscale_key.stdout | length > 0
        fail_msg: "SM secret 'TAILSCALE_AUTHKEY' is empty or not found"
      no_log: true

    - name: Fetch Caddy admin password
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get CADDY_ADMIN_PASSWORD"
      register: caddy_password
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Caddy admin password is non-empty
      ansible.builtin.assert:
        that: caddy_password.stdout | length > 0
        fail_msg: "SM secret 'CADDY_ADMIN_PASSWORD' is empty or not found"
      no_log: true

    - name: Fetch Postgres password
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get POSTGRES_PASSWORD"
      register: postgres_password
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Postgres password is non-empty
      ansible.builtin.assert:
        that: postgres_password.stdout | length > 0
        fail_msg: "SM secret 'POSTGRES_PASSWORD' is empty or not found"
      no_log: true

    - name: Fetch OpenCode Go API key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get OPENCODE_GO_API_KEY"
      register: opencode_go_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert OpenCode Go API key is non-empty
      ansible.builtin.assert:
        that: opencode_go_key.stdout | length > 0
        fail_msg: "SM secret 'OPENCODE_GO_API_KEY' is empty or not found"
      no_log: true

    - name: Fetch OpenRouter API key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get OPENROUTER_API_KEY"
      register: openrouter_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert OpenRouter API key is non-empty
      ansible.builtin.assert:
        that: openrouter_key.stdout | length > 0
        fail_msg: "SM secret 'OPENROUTER_API_KEY' is empty or not found"
      no_log: true

    - name: Fetch Hermes API server key
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get HERMES_API_SERVER_KEY"
      register: hermes_api_server_key
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Hermes API server key is non-empty
      ansible.builtin.assert:
        that: hermes_api_server_key.stdout | length > 0
        fail_msg: "SM secret 'HERMES_API_SERVER_KEY' is empty or not found"
      no_log: true

    - name: Fetch Hermes dashboard password
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DASHBOARD_PASSWORD"
      register: hermes_dashboard_password
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Hermes dashboard password is non-empty
      ansible.builtin.assert:
        that: hermes_dashboard_password.stdout | length > 0
        fail_msg: "SM secret 'DASHBOARD_PASSWORD' is empty or not found"
      no_log: true

    - name: Fetch Hermes dashboard username
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DASHBOARD_USERNAME"
      register: hermes_dashboard_username
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Fetch Hermes dashboard signing secret
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get DASHBOARD_SECRET"
      register: hermes_dashboard_secret
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Hermes dashboard signing secret is non-empty
      ansible.builtin.assert:
        that: hermes_dashboard_secret.stdout | length > 0
        fail_msg: "SM secret 'DASHBOARD_SECRET' is empty or not found"
      no_log: true

    - name: Compute dashboard password scrypt hash (hermes plugin format)
      ansible.builtin.shell: |
        python3 -c 'import hashlib, base64, secrets, os
        pw = os.environ["DASH_PW"]
        salt = secrets.token_bytes(16)
        dk = hashlib.scrypt(pw.encode(), salt=salt, n=2**14, r=8, p=1, dklen=32, maxmem=0)
        print("scrypt$16384$8$1$" + base64.b64encode(salt).decode() + "$" + base64.b64encode(dk).decode())'
      environment:
        DASH_PW: "{{ hermes_dashboard_password.stdout }}"
      register: hermes_dashboard_hash
      changed_when: false
      no_log: true

    # ── Render k8s Secret manifests ──────────────────────────────
    - name: Render hermes-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-hermes-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: hermes-secrets
            namespace: hermes
          type: Opaque
          data:
            DISCORD_BOT_TOKEN: {{ hermes_discord.stdout | b64encode }}
            DISCORD_ALLOWED_USERS: {{ discord_allowed_users.stdout | b64encode }}
            OPENCODE_GO_API_KEY: {{ opencode_go_key.stdout | b64encode }}
            OPENROUTER_API_KEY: {{ openrouter_key.stdout | b64encode }}
            API_SERVER_KEY: {{ hermes_api_server_key.stdout | b64encode }}
            HERMES_DASHBOARD_BASIC_AUTH_USERNAME: {{ hermes_dashboard_username.stdout | b64encode }}
            HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: {{ hermes_dashboard_hash.stdout | b64encode }}
            HERMES_DASHBOARD_BASIC_AUTH_SECRET: {{ hermes_dashboard_secret.stdout | b64encode }}
      no_log: true

    - name: Render n8n-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-n8n-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: n8n-secrets
            namespace: n8n
          type: Opaque
          data:
            encryption_key: {{ n8n_encryption_key.stdout | b64encode }}
            DB_POSTGRESDB_PASSWORD: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render postgres-secrets k8s Secret (n8n namespace)
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-postgres-secrets-n8n-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: n8n
          type: Opaque
          data:
            postgres-password: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render postgres-secrets k8s Secret (auth namespace)
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-postgres-secrets-auth-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: auth
          type: Opaque
          data:
            postgres-password: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render zitadel-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-zitadel-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: zitadel-secrets
            namespace: auth
          type: Opaque
          data:
            masterkey: {{ zitadel_masterkey.stdout | b64encode }}
            ZITADEL_ADMIN_PASSWORD: {{ zitadel_admin_password.stdout | b64encode }}
            db_dsn: {{ ('postgresql://postgres:' ~ (postgres_password.stdout | urlencode) ~ '@postgres-postgresql.n8n:5432/zitadel?sslmode=disable') | b64encode }}
      no_log: true

    - name: Render headroom-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-headroom-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: headroom-secrets
            namespace: hermes
          type: Opaque
          data:
            MINIMAX_API_KEY: {{ minimax_key.stdout | b64encode }}
      no_log: true

    # ── Render k8s ConfigMap ─────────────────────────────────────
    - name: Render tofu-inputs k8s ConfigMap
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-tofu-inputs-configmap.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tofu-inputs
            namespace: hermes
          data:
            vps_host: {{ vps_host | to_json }}
            vps_ssh_user: {{ vps_ssh_user | to_json }}
            vps_ssh_port: {{ vps_ssh_port | to_json }}
      no_log: true

    # ── Render host-level files ──────────────────────────────────
    - name: Render /etc/agent/config.json
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-agent-config.json"
        mode: "0600"
        content: "{{ agent_config_content }}"
      no_log: true
      vars:
        agent_config_content: |
          {
            "domain":     {{ domain_name | to_json }},
            "subdomains": {{ domain_subdomains | to_json }},
            "vps_host":   {{ vps_host | to_json }},
            "ssh_user":   {{ vps_ssh_user | to_json }},
            "ssh_port":   {{ vps_ssh_port }},
            "ssh_private_key": {{ vps_ssh_key_json.stdout | to_json }},
            "tofu_inputs": {{ tofu_inputs_obj | to_json }}
          }

    - name: Render Tailscale auth key file
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-tailscale-authkey"
        mode: "0600"
        content: "{{ tailscale_key.stdout }}"
      no_log: true

    - name: Fetch Cloudflare API token
      ansible.builtin.command: "{{ playbook_dir }}/../../scripts/bws-get RCLB_DEV_CLOUDFLARE_API_KEY"
      register: cloudflare_token
      changed_when: false
      no_log: true
      environment:
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"

    - name: Assert Cloudflare API token is non-empty
      ansible.builtin.assert:
        that: cloudflare_token.stdout | length > 0
        fail_msg: "SM secret 'RCLB_DEV_CLOUDFLARE_API_KEY' is empty or not found"
      no_log: true

    - name: Render Caddy environment file
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-caddy-env"
        mode: "0600"
        content: |
          CLOUDFLARE_API_TOKEN={{ cloudflare_token.stdout }}
      no_log: true

    - name: Render VPS SSH private key (reference artifact)
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-ssh-keys-rbelem"
        mode: "0600"
        content: "{{ vps_ssh_key_json.stdout }}"
      no_log: true

    # ── Summary ──────────────────────────────────────────────────
    - name: Print render summary
      ansible.builtin.debug:
        msg: |
          Rendered Bitwarden SM secrets (via bws) to {{ rendered_dir }}:
          k8s Secrets:
            - {{ k8s_secrets_dir }}/assistant-hermes-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-n8n-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-postgres-secrets-n8n-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-postgres-secrets-auth-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-zitadel-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-headroom-secrets-secret.yaml
          k8s ConfigMaps:
            - {{ k8s_secrets_dir }}/assistant-tofu-inputs-configmap.yaml
          Host files:
            - {{ host_files_dir }}/etc-agent-config.json
            - {{ host_files_dir }}/etc-tailscale-authkey
            - {{ host_files_dir }}/etc-caddy-env
            - {{ host_files_dir }}/etc-ssh-keys-rbelem
          Next: ansible-playbook -i inventory/hosts.yml playbooks/secrets-apply.yml
