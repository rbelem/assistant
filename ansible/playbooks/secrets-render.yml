---
# secrets-render.yml — render Bitwarden vault items to local .rendered/ files.
#
# Runs on the WORKSTATION (localhost, connection: local). The master password
# never touches the VPS — bitw auto-unlocks via libsecret keyring (entry
# "bitwarden master-password") or the PASSWORD env var on the workstation.
#
# Outputs (all under .rendered/, gitignored):
#   k8s-secrets/assistant-*-secret.yaml     — k8s Secret manifests
#   k8s-secrets/assistant-*-configmap.yaml  — k8s ConfigMap manifests
#   host-files/etc-agent-config.json        — consumed by NixOS modules
#   host-files/etc-tailscale-authkey        — Tailscale auth key file
#   host-files/etc-caddy-env                — Caddy env file (Porkbun keys)
#   host-files/etc-ssh-keys-rbelem          — VPS SSH private key (reference)
#
# The companion playbook secrets-apply.yml copies the pinned allowlist from
# .rendered/ to the VPS and applies the k8s manifests.
#
# Prerequisites:
#   - bitw CLI installed on workstation
#   - bitw login tokens valid (bitw status shows token_valid valid)
#   - vault synced (bitw sync)
#   - master password in libsecret keyring OR PASSWORD env var set
- name: Render Bitwarden vault items to local .rendered/ files
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    rendered_dir: "{{ playbook_dir }}/../../.rendered"
    k8s_secrets_dir: "{{ rendered_dir }}/k8s-secrets"
    host_files_dir: "{{ rendered_dir }}/host-files"

  tasks:
    # ── Preflight ────────────────────────────────────────────────
    - name: Check bitw CLI is available
      ansible.builtin.command: which bitw
      register: bitw_which
      changed_when: false

    - name: Fail if bitw CLI not found
      ansible.builtin.fail:
        msg: "bitw CLI not found on workstation. Install the rbelem/bitw fork."
      when: bitw_which.rc != 0

    - name: Validate bitw login tokens
      ansible.builtin.command: bitw status
      register: bitw_status
      changed_when: false
      failed_when: false

    - name: Fail if bitw login tokens are invalid
      ansible.builtin.fail:
        msg: |
          bitw login tokens are invalid or expired.
          On the workstation, run:
            bitw login
          Or store master password in libsecret:
            secret-tool store --label="Bitwarden" bitwarden master-password
      when: "'token_valid' not in bitw_status.stdout or 'valid' not in bitw_status.stdout"

    - name: Sync Bitwarden vault cache
      ansible.builtin.command: bitw sync
      changed_when: false

    - name: Ensure render output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ rendered_dir }}"
        - "{{ k8s_secrets_dir }}"
        - "{{ host_files_dir }}"

    # ── Fetch Secure Notes (JSON payloads) ───────────────────────
    - name: Fetch VPS SSH key item (type 5)
      ansible.builtin.command: bitw get --json "assistant/vps-ssh-key"
      register: vps_ssh_key_json
      changed_when: false
      no_log: true

    - name: Assert VPS SSH key non-empty
      ansible.builtin.assert:
        that: "(vps_ssh_key_json.stdout | from_json).sshKey.privateKey | length > 0"
        fail_msg: "Bitwarden item 'assistant/vps-ssh-key' returned empty SSH key"

    - name: Fetch Domain Config (Secure Note JSON)
      ansible.builtin.command: bitw get --field notes "assistant/domain-config"
      register: domain_json_raw
      changed_when: false
      no_log: true

    - name: Assert Domain Config non-empty and valid JSON
      ansible.builtin.assert:
        that:
          - domain_json_raw.stdout | length > 0
          - (domain_json_raw.stdout | from_json) is mapping
        fail_msg: "Bitwarden item 'assistant/domain-config' is empty or not valid JSON"

    - name: Set domain facts
      ansible.builtin.set_fact:
        domain_name: "{{ (domain_json_raw.stdout | from_json).domain }}"
        domain_subdomains: "{{ (domain_json_raw.stdout | from_json).subdomains }}"

    - name: Fetch Tofu Inputs (Secure Note JSON)
      ansible.builtin.command: bitw get --field notes "assistant/tofu-inputs"
      register: tofu_inputs_raw
      changed_when: false
      no_log: true

    - name: Assert Tofu Inputs non-empty and valid JSON
      ansible.builtin.assert:
        that:
          - tofu_inputs_raw.stdout | length > 0
          - (tofu_inputs_raw.stdout | from_json) is mapping
        fail_msg: "Bitwarden item 'assistant/tofu-inputs' is empty or not valid JSON"

    - name: Set tofu-inputs facts
      ansible.builtin.set_fact:
        vps_host: "{{ (tofu_inputs_raw.stdout | from_json).vps_host }}"
        vps_ssh_user: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_user }}"
        vps_ssh_port: "{{ (tofu_inputs_raw.stdout | from_json).vps_ssh_port }}"
        tofu_inputs_obj: "{{ tofu_inputs_raw.stdout | from_json }}"

    # ── Fetch Login items (password field) ───────────────────────
    - name: Fetch minimax API key
      ansible.builtin.command: bitw get --field password "assistant/minimax-api-key"
      register: minimax_key
      changed_when: false
      no_log: true

    - name: Assert minimax key is non-empty
      ansible.builtin.assert:
        that: minimax_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/minimax-api-key' returned empty or not found"

    - name: Fetch Hermes Discord bot token
      ansible.builtin.command: bitw get --field password "assistant/hermes-discord-token"
      register: hermes_discord
      changed_when: false
      no_log: true

    - name: Assert Hermes Discord token is non-empty
      ansible.builtin.assert:
        that: hermes_discord.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/hermes-discord-token' returned empty or not found"

    - name: Fetch n8n encryption key
      ansible.builtin.command: bitw get --field password "assistant/n8n-encryption-key"
      register: n8n_encryption_key
      changed_when: false
      no_log: true

    - name: Assert n8n encryption key is non-empty
      ansible.builtin.assert:
        that: n8n_encryption_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/n8n-encryption-key' returned empty or not found"

    - name: Fetch Zitadel masterkey
      ansible.builtin.command: bitw get --field password "assistant/zitadel-masterkey"
      register: zitadel_masterkey
      changed_when: false
      no_log: true

    - name: Assert Zitadel masterkey is non-empty
      ansible.builtin.assert:
        that: zitadel_masterkey.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/zitadel-masterkey' returned empty or not found"

    - name: Fetch Zitadel admin password
      ansible.builtin.command: bitw get --field password "assistant/zitadel-admin-password"
      register: zitadel_admin_password
      changed_when: false
      no_log: true

    - name: Assert Zitadel admin password is non-empty
      ansible.builtin.assert:
        that: zitadel_admin_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/zitadel-admin-password' returned empty or not found"

    - name: Fetch Porkbun API key
      ansible.builtin.command: bitw get --field password "assistant/porkbun-api-key"
      register: porkbun_api_key
      changed_when: false
      no_log: true

    - name: Assert Porkbun API key is non-empty
      ansible.builtin.assert:
        that: porkbun_api_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/porkbun-api-key' returned empty or not found"

    - name: Fetch Porkbun secret API key
      ansible.builtin.command: bitw get --field password "assistant/porkbun-secret-api-key"
      register: porkbun_secret_api_key
      changed_when: false
      no_log: true

    - name: Assert Porkbun secret API key is non-empty
      ansible.builtin.assert:
        that: porkbun_secret_api_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/porkbun-secret-api-key' returned empty or not found"

    - name: Fetch Tailscale auth key
      ansible.builtin.command: bitw get --field password "assistant/tailscale-authkey"
      register: tailscale_key
      changed_when: false
      no_log: true

    - name: Assert Tailscale auth key is non-empty
      ansible.builtin.assert:
        that: tailscale_key.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/tailscale-authkey' returned empty or not found"

    - name: Fetch Caddy admin password
      ansible.builtin.command: bitw get --field password "assistant/caddy-admin-password"
      register: caddy_password
      changed_when: false
      no_log: true

    - name: Assert Caddy admin password is non-empty
      ansible.builtin.assert:
        that: caddy_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/caddy-admin-password' returned empty or not found"

    - name: Fetch Postgres password
      ansible.builtin.command: bitw get --field password "assistant/postgres-password"
      register: postgres_password
      changed_when: false
      no_log: true

    - name: Assert Postgres password is non-empty
      ansible.builtin.assert:
        that: postgres_password.stdout | length > 0
        fail_msg: "Bitwarden item 'assistant/postgres-password' returned empty or not found"

    # ── Render k8s Secret manifests ──────────────────────────────
    - name: Render hermes-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-hermes-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: hermes-secrets
            namespace: hermes
          type: Opaque
          data:
            MINIMAX_API_KEY: {{ minimax_key.stdout | b64encode }}
            DISCORD_BOT_TOKEN: {{ hermes_discord.stdout | b64encode }}
      no_log: true

    - name: Render n8n-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-n8n-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: n8n-secrets
            namespace: n8n
          type: Opaque
          data:
            encryption_key: {{ n8n_encryption_key.stdout | b64encode }}
            DB_POSTGRESDB_PASSWORD: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render postgres-secrets k8s Secret (n8n namespace)
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-postgres-secrets-n8n-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: n8n
          type: Opaque
          data:
            postgres-password: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render postgres-secrets k8s Secret (auth namespace)
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-postgres-secrets-auth-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-secrets
            namespace: auth
          type: Opaque
          data:
            postgres-password: {{ postgres_password.stdout | b64encode }}
      no_log: true

    - name: Render zitadel-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-zitadel-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: zitadel-secrets
            namespace: auth
          type: Opaque
          data:
            masterkey: {{ zitadel_masterkey.stdout | b64encode }}
            ZITADEL_ADMIN_PASSWORD: {{ zitadel_admin_password.stdout | b64encode }}
      no_log: true

    - name: Render headroom-secrets k8s Secret
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-headroom-secrets-secret.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: headroom-secrets
            namespace: hermes
          type: Opaque
          data:
            MINIMAX_API_KEY: {{ minimax_key.stdout | b64encode }}
      no_log: true

    # ── Render k8s ConfigMap ─────────────────────────────────────
    - name: Render tofu-inputs k8s ConfigMap
      ansible.builtin.copy:
        dest: "{{ k8s_secrets_dir }}/assistant-tofu-inputs-configmap.yaml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: tofu-inputs
            namespace: hermes
          data:
            vps_host: {{ vps_host | to_json }}
            vps_ssh_user: {{ vps_ssh_user | to_json }}
            vps_ssh_port: {{ vps_ssh_port | to_json }}
      no_log: true

    # ── Render host-level files ──────────────────────────────────
    - name: Render /etc/agent/config.json
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-agent-config.json"
        mode: "0600"
        content: "{{ agent_config_content }}"
      no_log: true
      vars:
        agent_config_content: |
          {
            "domain":     {{ domain_name | to_json }},
            "subdomains": {{ domain_subdomains | to_json }},
            "vps_host":   {{ vps_host | to_json }},
            "ssh_user":   {{ vps_ssh_user | to_json }},
            "ssh_port":   {{ vps_ssh_port }},
            "ssh_private_key": {{ (vps_ssh_key_json.stdout | from_json).sshKey.privateKey | to_json }},
            "tofu_inputs": {{ tofu_inputs_obj | to_json }}
          }

    - name: Render Tailscale auth key file
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-tailscale-authkey"
        mode: "0600"
        content: "{{ tailscale_key.stdout }}"
      no_log: true

    - name: Render Caddy environment file
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-caddy-env"
        mode: "0600"
        content: |
          PORKBUN_API_KEY={{ porkbun_api_key.stdout }}
          PORKBUN_SECRET_API_KEY={{ porkbun_secret_api_key.stdout }}
      no_log: true

    - name: Render VPS SSH private key (reference artifact)
      ansible.builtin.copy:
        dest: "{{ host_files_dir }}/etc-ssh-keys-rbelem"
        mode: "0600"
        content: "{{ (vps_ssh_key_json.stdout | from_json).sshKey.privateKey }}"
      no_log: true

    # ── Summary ──────────────────────────────────────────────────
    - name: Print render summary
      ansible.builtin.debug:
        msg: |
          Rendered Bitwarden vault items to {{ rendered_dir }}:
          k8s Secrets:
            - {{ k8s_secrets_dir }}/assistant-hermes-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-n8n-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-postgres-secrets-n8n-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-postgres-secrets-auth-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-zitadel-secrets-secret.yaml
            - {{ k8s_secrets_dir }}/assistant-headroom-secrets-secret.yaml
          k8s ConfigMaps:
            - {{ k8s_secrets_dir }}/assistant-tofu-inputs-configmap.yaml
          Host files:
            - {{ host_files_dir }}/etc-agent-config.json
            - {{ host_files_dir }}/etc-tailscale-authkey
            - {{ host_files_dir }}/etc-caddy-env
            - {{ host_files_dir }}/etc-ssh-keys-rbelem
          Next: ansible-playbook -i inventory/hosts.yml playbooks/secrets-apply.yml
