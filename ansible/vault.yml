***REMOVED*** ── Render flow ───────────────────────────────────────────────────────────────
***REMOVED*** 1. Workstation: `scripts/fetch_vault.sh` reads SM keys via `bws` (via
***REMOVED***    scripts/lib/bws.sh) and renders to .rendered/ (vault.env, terraform.tfvars,
***REMOVED***    runtime-config.json).
***REMOVED*** 2. Workstation: `ansible/playbooks/secrets-render.yml` reads SM keys via
***REMOVED***    `scripts/bws-get` and renders k8s Secret/ConfigMap manifests + host files
***REMOVED***    to .rendered/.
***REMOVED*** 3. VPS: `ansible/playbooks/secrets-apply.yml` copies the pinned allowlist
***REMOVED***    from .rendered/ to the VPS. No SM token, no bws binary on the VPS.
***REMOVED***
***REMOVED*** Compromise of the VPS yields only rendered runtime secrets (bounded blast
***REMOVED*** radius), not the SM access token (force multiplier).
