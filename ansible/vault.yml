# Bitwarden Secrets Manager (SM) Layout for zet
#
# Secrets live in Bitwarden Secrets Manager, accessed via a machine-account
# access token. No master password, no interactive login.
#
# ── Access token ──────────────────────────────────────────────────────────────
# The SM access token authenticates `bws` commands. It must be configured on the
# **workstation only** — never on the VPS.
#
# Configuration (checked in order):
#   1. BWS_ACCESS_TOKEN env var (same token value as SM_ACCESS_TOKEN)
#   2. ~/.config/bitw/config (key: sm_access_token)
#
# Get a token: Bitwarden Secrets Manager web vault → Organization → Machine
# Accounts → create a machine account → copy the access token.
#
# ── SM key layout ─────────────────────────────────────────────────────────────
# All keys live under the `zet` project in Bitwarden Secrets Manager.
# Uppercase snake_case names — the project provides namespace.
#
# | SM Key                  | Value                          | Source / Notes                          |
# |-------------------------|--------------------------------|-----------------------------------------|
# | VPS_SSH_KEY             | SSH private key (PEM, raw)     | Generated once; public key derived      |
# | DOMAIN_CONFIG           | JSON: {domain, subdomains}     | e.g. {"domain":"example.com","subdomains":["hermes","status"]} |
# | TOFU_INPUTS             | JSON: vps_host, vps_ssh_user,  | Composed by populate-sm.sh              |
# |                         |   vps_ssh_port, TF vars,       |                                         |
# |                         |   storage creds, etc.          |                                         |
# | MINIMAX_API_KEY         | minimax.io API key (raw)       | https://minimax.io/                     |
# | DISCORD_BOT_TOKEN       | Discord bot token (raw)        | Discord Developer Portal → Bot → Token  |
# | DISCORD_ALLOWED_USERS   | Comma-separated user IDs (raw) | Discord user IDs allowed to talk to Zet |
# | N8N_ENCRYPTION_KEY      | 32+ char random hex (raw)      | `openssl rand -hex 32`                  |
# | ZITADEL_MASTERKEY       | 32+ char random key (raw)      | Zitadel Helm install                    |
# | ZITADEL_ADMIN_PASSWORD  | Strong admin password (raw)    | Zitadel initial admin                   |
# | RCLB_DEV_CLOUDFLARE_API_KEY  | Cloudflare API token (cfat_*, raw)  | Zone:Read + Zone:DNS:Edit |
# | TAILSCALE_AUTHKEY       | Tailscale auth key (raw)       | https://login.tailscale.com/admin/settings/keys |
# | POSTGRES_PASSWORD       | Strong postgres password (raw) | `openssl rand -base64 32`; shared by n8n + Zitadel |
# | OPENCODE_GO_API_KEY     | opencode-go API key (raw)      |                                         |
# | HERMES_API_SERVER_KEY   | Hermes API server key (raw)    | API key for the agent's own OpenAI-compatible API server (upstream hermes-agent product, unchanged by project rename) |
# | DASHBOARD_PASSWORD      | Zet dashboard password (raw)   |                                         |
# | DASHBOARD_USERNAME      | Zet dashboard username (raw)   |                                         |
# | DASHBOARD_SECRET        | Zet dashboard secret (raw)     |                                         |
# | OPENROUTER_API_KEY      | OpenRouter API key (raw)       | Superseded by minimax-api-key; kept for reference |
# | VPS_ROOT_PASSWORD       | VPS root password (raw)        | OVH emailed password or reset           |
# | VPS_SUDO_PASSWORD       | VPS sudo password (raw)        |                                         |
# | RESTIC_BACKUP_PASSWORD  | Restic backup encryption password (raw) | Backups deferred (2026-07-27) |
#
# ── SM snapshot ────────────────────────────────────────────────────────────────
# The tofu state snapshot moved from the personal vault to SM as
# TOFU_STATE_SNAPSHOT. Read/written by scripts/snapshot-state.sh and
# scripts/restore-state.sh using bws_get / bws secret edit.
#
# sm_access_token in ~/.config/bitw/config is shared between bitw and bws.
# The personal vault item (zet/tofu-state-snapshot) is no longer used.
#
# ── Render flow ───────────────────────────────────────────────────────────────
# 1. Workstation: `scripts/fetch_vault.sh` reads SM keys via `bws` (via
#    scripts/lib/bws.sh) and renders to .rendered/ (vault.env, terraform.tfvars,
#    runtime-config.json).
# 2. Workstation: `ansible/playbooks/secrets-render.yml` reads SM keys via
#    `scripts/bws-get` and renders k8s Secret/ConfigMap manifests + host files
#    to .rendered/.
# 3. VPS: `ansible/playbooks/secrets-apply.yml` copies the pinned allowlist
#    from .rendered/ to the VPS. No SM token, no bws binary on the VPS.
#
# Compromise of the VPS yields only rendered runtime secrets (bounded blast
# radius), not the SM access token (force multiplier).
#
# ── Bootstrap ─────────────────────────────────────────────────────────────────
# First-time setup: `scripts/populate-sm.sh` creates the 3 structural SM keys
# (VPS_SSH_KEY, DOMAIN_CONFIG, TOFU_INPUTS).
# The remaining keys (API keys, passwords, tokens) are created manually in
# the Bitwarden Secrets Manager web vault.
