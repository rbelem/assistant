***REMOVED*** Bitwarden Secrets Manager (SM) Layout for assistant
***REMOVED***
***REMOVED*** Secrets live in Bitwarden Secrets Manager, accessed via a machine-account
***REMOVED*** access token. No master password, no interactive login.
***REMOVED***
***REMOVED*** ── Access token ──────────────────────────────────────────────────────────────
***REMOVED*** The SM access token authenticates `bws` commands. It must be configured on the
***REMOVED*** **workstation only** — never on the VPS.
***REMOVED***
***REMOVED*** Configuration (checked in order):
***REMOVED***   1. BWS_ACCESS_TOKEN env var (same token value as SM_ACCESS_TOKEN)
***REMOVED***   2. ~/.config/bitw/config (key: sm_access_token)
***REMOVED***
***REMOVED*** Get a token: Bitwarden Secrets Manager web vault → Organization → Machine
***REMOVED*** Accounts → create a machine account → copy the access token.
***REMOVED***
