all:
  hosts:
    rodrigo-agent:
      ansible_host: "{{ vps_ip | default('agent.REDACTED-DOMAIN') }}"
      ansible_user: root
      ansible_python_interpreter: /usr/bin/python3
  vars:
    namespace_list:
      - hermes
      - monitoring
      - n8n
      - auth
    vps_hostname: rodrigo-agent
    domain: REDACTED-DOMAIN
    k8s_manifests_base: /opt/k8s
